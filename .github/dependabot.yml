version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # No "reviewers" key: GitHub retired it from dependabot.yml; review
    # requests come from a CODEOWNERS file instead.
    versioning-strategy: increase
    groups:
      npm:
        update-types:
          - "minor"
          - "patch"

  # Keeps the SHA-pinned GitHub Actions in .github/workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "ci"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
          - "major"
