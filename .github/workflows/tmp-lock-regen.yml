# Einmaliger Helfer: erzeugt package-lock.json mit npm neu (die private
# @callmetechie-Registry braucht den Packages-Token, den nur die CI hat).
# Wird im selben PR wieder entfernt.
name: Temp – Lockfile neu erzeugen

on:
  push:
    branches: [fix/deps-audit]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_AUTH_TOKEN: ${{ secrets.GC_PAT }}

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm --version
      - run: npm install --package-lock-only --ignore-scripts --no-fund
      - run: npm ls zod @callmetechie/gatecontrol-config-hash --package-lock-only
      - run: npm audit --package-lock-only || true
      - run: git diff --stat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 1
