name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Auth for the private @callmetechie GitHub Packages registry (see .npmrc).
  # Repo secret GC_PAT = classic PAT with read:packages.
  NODE_AUTH_TOKEN: ${{ secrets.GC_PAT }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  # Windows Hello (Vault unlock) against the real Windows Runtime: availability detection, the WinRT layout
  # (buffers, KeyCredentialManager, async operations) — no prompt, runners have no Hello. Plus the Hello / koffi
  # unit tests on Windows' ABI. And the autostart task against the real Task Scheduler (schtasks /XML). And the OCR of
  # Windows (Drive scans → searchable PDF): its WinRT layout, the words of a test picture when the runner has an OCR language.
  # And the folders of the person signed in (utils/user-folders.js): SID, ProfileList and User Shell Folders through koffi.
  # And SendInput of "Bildschirm teilen" (services/screen-input.js): the INPUT layout, the virtual and the input desktop.
  windows-hello:
    name: Windows Hello (WinRT, no prompt)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: node --test test/windows-hello.win.test.js test/windows-hello.test.js test/vault-hello.test.js test/autostart-task.test.js test/autostart-task.win.test.js test/windows-ocr.win.test.js test/windows-ocr.test.js test/user-folders.win.test.js test/user-folders.test.js test/screen-input.win.test.js test/screen-share.test.js

  # Medien (Stufe 4e), the spike of the LAN binding with the VPN on: a real wireguard-nt adapter carries a network,
  # a connection bound to the LAN address (localAddress) still goes through the LAN, the host route of Plan B; and SMB
  # through Windows itself (a local share and user, WNetAddConnection2W, error 1219). Elevated runner, changes only
  # in memory (routes store=active) and removed again.
  media-windows:
    name: "Medien (Windows: VPN-Route, SMB)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: node --test --test-concurrency=1 test/media.win.test.js test/media-lan.test.js test/media-share.test.js test/media-folders.test.js
        env:
          GC_MEDIA_SPIKE: '1'
